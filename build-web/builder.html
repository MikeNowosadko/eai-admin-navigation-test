<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<script src="../assets/dev-cache.js?v=mtg8tt0q.j1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="eai-url" content="app.enterpriseaigroup.com/builder" />
<title>Prototype — Enterprise AI Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/proto.css?v=mtg8tt0q.j1" />
<link rel="stylesheet" href="../assets/signup.css?v=mtg8tt0q.j1" />
<link rel="stylesheet" href="../assets/build.css?v=mtg8tt0q.j1" />
<link rel="stylesheet" href="../assets/build-sugar-enter.css?v=mtg8tt0q.j1" />
<link rel="stylesheet" href="../assets/build-web-app.css?v=mtg8tt0q.j1" />
<link rel="stylesheet" href="../assets/build-web-mvp.css?v=mtg8tt0q.j1" />
</head>
<!-- /build-web — MVP builder. No smart blocks. -->
<body class="nb bd-builder bd-web-app" data-bd-strip="off" data-bd-blocks="off">

  <div class="nb-shell">

    <aside class="nb-side">
      <button class="nb-ws" type="button">
        <span class="tile" id="wsInitial">?</span>
        <span class="tx">
          <b id="wsName">Preview</b>
          <span>Guest &middot; <span id="wsPlan">No account yet</span></span>
        </span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 15l5 5 5-5M7 9l5-5 5 5" stroke="#9A9AA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="nb-tabs" role="tablist" aria-label="How you build">
        <button class="nb-tab on" type="button" role="tab" aria-selected="true" data-tab="ncb">No code builder</button>
        <button class="nb-tab" type="button" role="tab" aria-selected="false" data-tab="cli" id="tabCli">CLI</button>
      </div>
      <nav class="nb-nav">
        <a class="nb-item" href="#" data-stub><span>Home</span></a>
        <a class="nb-item on" href="#" data-stub><span>All apps</span><i class="count" id="processCount">1</i></a>
      </nav>
      <div class="nb-side-ft">
        <a class="bd-credits" id="creditCard" href="#" data-stub>
          <span class="hd"><b>Credits</b><i><span id="crLeft">100</span> of 100 left</i></span>
          <span class="bar"><i id="crBar" style="width:100%"></i></span>
          <span class="lbl" id="crLbl">50 free · no account yet</span>
        </a>
        <button class="nb-user" type="button">
          <span class="av" id="userAv">?</span>
          <span class="tx"><b id="userName">Guest</b><span>Sign in to save</span></span>
        </button>
      </div>
    </aside>

    <main class="nb-main bd-main">

      <header class="bd-top">
        <div class="bd-crumbs">
          <b id="bdProjectName">Process</b>
        </div>

        <nav class="bd-steps" id="bdSteps" aria-label="Progress">
          <span class="st on" data-step="plan">Plan</span>
          <span class="ln"></span>
          <span class="st" data-step="build">Build</span>
          <span class="ln"></span>
          <span class="st" data-step="deploy">Deploy</span>
        </nav>

        <div class="bd-top-acts">
          <button class="nb-btn" type="button" id="bdLogin">Sign In / Sign Up</button>
          <button class="nb-btn" type="button" id="bdSuggest" hidden>Suggest improvements <i class="bd-cost">15</i></button>
          <button class="nb-btn primary" type="button" id="bdPublish" disabled>Publish <i class="bd-cost">10</i></button>
        </div>
      </header>

      <div class="bd-body">

        <section class="bd-chat" id="bdChat">
          <div class="bd-log" id="bdLog"></div>
          <div class="bd-anchor" id="bdAnchor"></div>
          <div class="bd-composer-row">
            <textarea id="bdSay" rows="3" placeholder="Ask or add context&hellip;" autocomplete="off"></textarea>
            <div class="bd-composer-actions">
              <button class="nb-btn primary" type="button" id="bdSend" aria-label="Send message" title="Send">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <i class="bd-cost">10</i>
              </button>
            </div>
          </div>
        </section>

        <aside class="bd-preview" id="bdPreview">
          <div class="bd-pv-bar">
            <div class="bd-seg" id="bdMode">
              <button type="button" class="on" data-mode="preview">Preview</button>
              <button type="button" data-mode="dashboard">Dashboard</button>
            </div>
            <div class="bd-seg" id="bdDevice">
              <button type="button" class="on" data-device="desktop" title="Desktop">
                <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </button>
              <button type="button" data-device="tablet" title="Tablet">
                <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="2" width="14" height="20" rx="2" stroke="currentColor" stroke-width="2"/></svg>
              </button>
              <button type="button" data-device="mobile" title="Mobile">
                <svg viewBox="0 0 24 24" fill="none"><rect x="7" y="2" width="10" height="20" rx="2" stroke="currentColor" stroke-width="2"/></svg>
              </button>
            </div>
          </div>
          <div class="bd-pv-scroll"><div class="bd-pv-frame" id="bdFrame" data-device="desktop"></div></div>
        </aside>
      </div>
    </main>
  </div>

  <div class="bd-gate-overlay" id="authGate" hidden role="dialog" aria-modal="true" aria-labelledby="gateLede">
    <div class="bd-gate-card bd-gate-auth bd-wizard-gate">
      <button class="bd-auth-close" type="button" id="authClose" aria-label="Close sign in">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="bd-auth-brand" aria-label="Enterprise AI">
        <img src="../assets/logos/eai-wordmark.svg?v=mtg8tt0q.j1" alt="Enterprise AI" />
      </div>
      <div class="bd-wizard-panel bd-wizard-panel--signup" id="wizardStep1">
        <p class="bd-wizard-lede" id="gateLede">Sign in to continue editing</p>
        <div class="bd-wizard-field">
          <label for="gateEmail">Work email</label>
          <input type="email" id="gateEmail" autocomplete="email" inputmode="email" />
        </div>
        <div class="bd-wizard-or"><span>or</span></div>
        <div class="bd-oauth-stack">
          <button type="button" class="bd-oauth-btn" data-provider="google">Continue with Google</button>
          <button type="button" class="bd-oauth-btn" data-provider="github">Continue with GitHub</button>
          <button type="button" class="bd-oauth-btn" data-provider="microsoft">Continue with Microsoft</button>
        </div>
        <button class="bd-gate-go bd-wizard-submit bd-wizard-submit--foot" type="button" id="gateGo" disabled>Continue</button>
      </div>

      <div class="bd-wizard-panel" id="wizardStepOAuth" hidden>
        <button type="button" class="bd-wizard-back" id="oauthBack">Back</button>
        <p class="bd-wizard-lede" id="oauthTitle">Sign in with Google</p>
        <div class="bd-wizard-field">
          <label for="oauthEmail">Email</label>
          <input type="email" id="oauthEmail" autocomplete="email" inputmode="email" />
        </div>
        <button class="bd-gate-go bd-wizard-submit" type="button" id="oauthGo" disabled>Continue</button>
      </div>

      <div class="bd-wizard-panel" id="wizardStep2" hidden aria-hidden="true">
        <p class="bd-wizard-lede">Opening EnterpriseAI</p>
        <div class="bd-wizard-field">
          <label for="wsCountry">Country</label>
          <select id="wsCountry" autocomplete="country-name">
            <option value="Australia">Australia</option>
            <option value="New Zealand">New Zealand</option>
            <option value="Singapore">Singapore</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="United States">United States</option>
            <option value="Canada">Canada</option>
            <option value="Germany">Germany</option>
            <option value="France">France</option>
            <option value="Japan">Japan</option>
            <option value="India">India</option>
          </select>
        </div>
        <div class="bd-wizard-field bd-ws-name-field">
          <label for="wsNameInput">Workspace name</label>
          <div class="bd-ws-name-row">
            <div class="bd-ws-logo" aria-label="Workspace logo"></div>
            <input type="text" id="wsNameInput" autocomplete="organization" />
          </div>
        </div>
        <button class="bd-gate-go bd-wizard-submit" type="button" id="wsGo" disabled>Open in EnterpriseAI</button>
      </div>
    </div>
  </div>

<script src="../assets/build-prompt.js?v=mtg8tt0q.j1"></script>
<script src="../assets/page.js?v=mtg8tt0q.j1"></script>
<script type="module">
  import { playBuilderEnter } from '../assets/build-sugar-enter.js';

  const params = new URLSearchParams(location.search);
  const prompt = (params.get('prompt') || '').trim();

  async function boot() {
    if (params.get('enter') === '1' && prompt) {
      await playBuilderEnter(prompt);
    }
    window.dispatchEvent(new CustomEvent('bd-enter-done'));
  }

  boot();
</script>
<script src="../assets/build-sugar-builder.js?v=mtg8tt0q.j1"></script>
</body>
</html>
