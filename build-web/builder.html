<script type="module">
  const v = window.__EAI_DEV_V || Date.now().toString(36);
  const bust = window.__EAI_asset || ((p) => p);
  const { playBuilderEnter } = await import(bust('../assets/build-sugar-enter.js'));

  const params = new URLSearchParams(location.search);
  const prompt = (params.get('prompt') || '').trim();

  async function boot() {
    if (params.get('enter') === '1' && prompt) {
      await playBuilderEnter(prompt);
    }
    window.dispatchEvent(new CustomEvent('bd-enter-done'));
  }

  boot();
</script>

<script src="../assets/mkt-app-preview.js"></script>
<!-- The inline duplicate of the MKT_APP_PREVIEW renderer that used to sit here is gone.
     It was cache insurance for a bug that turned out to be a temporal-dead-zone throw in
     build-sugar-builder.js, and keeping a second copy of the markup in sync by hand was a
     standing drift risk. mkt-app-preview.js above is now the only renderer. -->
<script>
(function () {
  if (document.body.dataset.sugarhead !== 'on' || !window.MKT_APP_PREVIEW) return;
  var WF = [
    { id: 'submit', tab: 'Submit', previewTitle: 'Supplier submits the invoice', previewSub: 'Replaces the email inbox — every invoice is tracked from the moment it arrives.', fields: [{ label: 'Supplier name', type: 'Text', req: true }, { label: 'Invoice document', type: 'File', req: true }] },
    { id: 'review', tab: 'Review', previewTitle: 'Accounts checks it against the purchase order', previewSub: 'PO match status is visible before anyone approves.', fields: [{ label: 'PO match status', type: 'Select', req: true, opts: ['Matched'] }] },
    { id: 'approval', tab: 'Approval', previewTitle: 'Finance director signs off anything over $10,000', previewSub: 'Routing and reminders are built into the step.', fields: [{ label: 'Approval decision', type: 'Select', req: true, opts: ['Approve'] }] },
    { id: 'payment', tab: 'Payment', previewTitle: 'Payment is scheduled and the supplier is notified', previewSub: 'The supplier gets notified when payment is scheduled.', fields: [{ label: 'Payment date', type: 'Text', req: true }] },
  ];
  var params = new URLSearchParams(location.search);
  var prompt = (params.get('prompt') || 'Invoice processing').trim();
  var project = prompt.charAt(0).toUpperCase() + prompt.slice(1);
  window.__BD_WORKFLOW__ = WF;
  window.__BD_PROJECT__ = project;

  function paintStep(step) {
    var PL = window.MKT_APP_PREVIEW;
    var frame = document.getElementById('bdFrame');
    if (!PL || !frame) return;
    var app = PL.workflowToApp(WF, step, project);
    frame.innerHTML = PL.render(app, { activeStep: step, interactive: true });
    PL.bind(frame, { onStep: paintStep });
  }

  paintStep(0);
})();
</script>

<script src="../assets/build-sugar-builder.js"></script>
<script>
/* Safety net — if a stale build-sugar-builder.js painted the legacy pill preview, replace it. */
(function () {
  if (document.body.dataset.sugarhead !== 'on') return;

  function paintMkt(step) {
    var PL = window.MKT_APP_PREVIEW;
    var frame = document.getElementById('bdFrame');
    var wf = window.__BD_WORKFLOW__;
    if (!PL || !frame || !wf || !wf.length) return false;
    var app = PL.workflowToApp(wf, step, window.__BD_PROJECT__ || 'Your process');
    frame.innerHTML = PL.render(app, { activeStep: step, interactive: true });
    PL.bind(frame, {
      onStep: function (i) { paintMkt(i); },
    });
    return true;
  }

  function tryFix() {
    var frame = document.getElementById('bdFrame');
    if (!frame) return;
    if (frame.querySelector('.mkt-workflow-preview')) return;
    if (frame.querySelector('.bd-pv-mvp') || !frame.innerHTML.trim()) paintMkt(0);
  }

  tryFix();
  document.addEventListener('bd-enter-done', tryFix);
  var n = 0;
  var t = setInterval(function () {
    tryFix();
    if (++n > 40 || document.getElementById('bdFrame')?.querySelector('.mkt-workflow-preview')) clearInterval(t);
  }, 150);
})();
</script>
