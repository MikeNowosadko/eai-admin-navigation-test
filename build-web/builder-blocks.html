<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<script src="../assets/dev-cache.js?v=mtg8tt0q.j1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="eai-url" content="app.enterpriseaigroup.com/builder" />
<title>Prototype — Enterprise AI Builder (smart blocks)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/proto.css?v=mtg8tt0q.j1" />
<link rel="stylesheet" href="../assets/signup.css?v=mtg8tt0q.j1" />
<link rel="stylesheet" href="../assets/build.css?v=mtg8tt0q.j1" />
<link rel="stylesheet" href="../assets/build-sugar-focus.css?v=mtg8tt0q.j1" />
<link rel="stylesheet" href="../assets/build-sugar-enter.css?v=mtg8tt0q.j1" />
</head>
<!-- /build-web — smart blocks variant (stretch / desirability tests). -->
<body class="nb bd-builder bd-sugar-focus" data-bd-strip="off" data-bd-blocks="on">

  <div class="bd-enter" id="bdEnter" hidden>
    <div class="bd-enter-inner">
      <div class="bd-enter-prompt" id="bdEnterPrompt"></div>
      <p class="bd-enter-status">Opening the workshop</p>
    </div>
  </div>

  <div class="nb-shell">
    <aside class="nb-side" hidden aria-hidden="true">
      <button class="nb-ws" type="button">
        <span class="tile" id="wsInitial">?</span>
        <span class="tx"><b id="wsName">Preview</b><span>Guest &middot; <span id="wsPlan">No account yet</span></span></span>
      </button>
      <div class="nb-side-ft">
        <a class="bd-credits" id="creditCard" href="../build/pages/plans.html">
          <span class="hd"><b>Credits</b><i><span id="crLeft">100</span> of 100 left</i></span>
          <span class="bar"><i id="crBar" style="width:100%"></i></span>
          <span class="lbl" id="crLbl">50 free · no account yet</span>
        </a>
        <button class="nb-user" type="button">
          <span class="av" id="userAv">?</span>
          <span class="tx"><b id="userName">Guest</b><span>Sign in to save</span></span>
        </button>
      </div>
    </aside>

    <main class="nb-main bd-main">
      <header class="bd-top">
        <div class="bd-crumbs">
          <a class="bd-sugar-home" href="index-blocks.html" title="Back to site">
            <img src="../assets/logos/eai-wordmark.svg?v=mtg8tt0q.j1" alt="Enterprise AI" />
          </a>
          <span class="sep">/</span>
          <b id="bdProjectName">New process</b>
        </div>
        <nav class="bd-steps" id="bdSteps" aria-label="Progress">
          <span class="st on" data-step="plan">Plan</span>
          <span class="ln"></span>
          <span class="st" data-step="build">Build</span>
          <span class="ln"></span>
          <span class="st" data-step="deploy">Deploy</span>
        </nav>
        <div class="bd-top-acts">
          <button class="nb-btn" type="button" id="bdSuggest" hidden>Suggest improvements <i class="bd-cost">15</i></button>
          <button class="nb-btn primary" type="button" id="bdPublish" disabled>Publish <i class="bd-cost">10</i></button>
        </div>
      </header>
      <div class="bd-body">
        <section class="bd-chat" id="bdChat">
          <div class="bd-log" id="bdLog"></div>
          <div class="bd-anchor" id="bdAnchor"></div>
          <div class="bd-composer-row">
            <textarea id="bdSay" rows="3" placeholder="Describe a change&hellip;" autocomplete="off" disabled></textarea>
            <div class="bd-composer-actions">
              <button class="nb-btn primary" type="button" id="bdSend" disabled>Send <i class="bd-cost">10</i></button>
            </div>
          </div>
        </section>
        <aside class="bd-preview" id="bdPreview">
          <div class="bd-pv-bar">
            <div class="bd-seg" id="bdMode">
              <button type="button" class="on" data-mode="editor">Editor</button>
              <button type="button" data-mode="preview">Preview</button>
            </div>
            <div class="bd-seg" id="bdDevice">
              <button type="button" class="on" data-device="desktop" title="Desktop"><svg viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
              <button type="button" data-device="tablet" title="Tablet"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="2" width="14" height="20" rx="2" stroke="currentColor" stroke-width="2"/></svg></button>
              <button type="button" data-device="mobile" title="Mobile"><svg viewBox="0 0 24 24" fill="none"><rect x="7" y="2" width="10" height="20" rx="2" stroke="currentColor" stroke-width="2"/></svg></button>
            </div>
          </div>
          <div class="bd-pv-scroll"><div class="bd-pv-frame" id="bdFrame"></div></div>
        </aside>
      </div>
    </main>
  </div>

  <div class="bd-gate-overlay" id="authGate" hidden role="dialog" aria-modal="true" aria-labelledby="gateLede">
    <div class="bd-gate-card bd-gate-auth bd-wizard-gate">
      <div class="bd-wizard-rail" id="wizardRail" aria-hidden="true"><span class="on" data-step="1"></span><span data-step="2"></span></div>
      <div class="bd-wizard-panel bd-wizard-panel--signup" id="wizardStep1">
        <p class="bd-wizard-lede" id="gateLede">Sign up to keep building</p>
        <div class="bd-wizard-field"><label for="gateEmail">Work email</label><input type="email" id="gateEmail" autocomplete="email" inputmode="email" /></div>
        <div class="bd-wizard-or"><span>or</span></div>
        <div class="bd-oauth-stack">
          <button type="button" class="bd-oauth-btn" data-provider="google">Sign up with Google</button>
          <button type="button" class="bd-oauth-btn" data-provider="github">Sign up with GitHub</button>
          <button type="button" class="bd-oauth-btn" data-provider="microsoft">Sign up with Microsoft</button>
        </div>
        <button class="bd-gate-go bd-wizard-submit bd-wizard-submit--foot" type="button" id="gateGo" disabled>Continue</button>
      </div>
      <div class="bd-wizard-panel" id="wizardStepOAuth" hidden>
        <button type="button" class="bd-wizard-back" id="oauthBack">Back</button>
        <p class="bd-wizard-lede" id="oauthTitle">Sign in with Google</p>
        <div class="bd-wizard-field"><label for="oauthEmail">Email</label><input type="email" id="oauthEmail" autocomplete="email" inputmode="email" /></div>
        <button class="bd-gate-go bd-wizard-submit" type="button" id="oauthGo" disabled>Continue</button>
      </div>
      <div class="bd-wizard-panel" id="wizardStep2" hidden>
        <p class="bd-wizard-lede">Workspace</p>
        <div class="bd-wizard-field"><label for="wsCountry">Country</label>
          <select id="wsCountry" autocomplete="country-name">
            <option value="Australia">Australia</option><option value="New Zealand">New Zealand</option>
            <option value="Singapore">Singapore</option><option value="United Kingdom">United Kingdom</option>
            <option value="United States">United States</option><option value="Canada">Canada</option>
          </select>
        </div>
        <div class="bd-wizard-field bd-ws-name-field">
          <label for="wsNameInput">Workspace name</label>
          <div class="bd-ws-name-row"><div class="bd-ws-logo" aria-label="Workspace logo"></div><input type="text" id="wsNameInput" autocomplete="organization" /></div>
        </div>
        <button class="bd-gate-go bd-wizard-submit" type="button" id="wsGo" disabled>Continue building</button>
      </div>
    </div>
  </div>

<script src="../assets/build-prompt.js?v=mtg8tt0q.j1"></script>
<script src="../assets/page.js?v=mtg8tt0q.j1"></script>
<script type="module">
  import { playBuilderEnter } from '../assets/build-sugar-enter.js';
  const params = new URLSearchParams(location.search);
  const prompt = (params.get('prompt') || '').trim();
  async function boot() {
    if (params.get('enter') === '1' && prompt) await playBuilderEnter(prompt);
    window.dispatchEvent(new CustomEvent('bd-enter-done'));
  }
  boot();
</script>
<script src="../assets/build-sugar-builder.js?v=mtg8tt0q.j1"></script>
</body>
</html>
