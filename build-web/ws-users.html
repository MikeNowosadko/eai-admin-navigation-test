<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<script src="../assets/dev-cache.js?v=mtg8tt0q.j1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="eai-url" content="app.enterpriseaigroup.com/settings/users" />
<title>Prototype — Users &amp; roles · Enterprise AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/admin.css?v=mtg8tt0q.j1" />
</head>
<body class="ad" data-ad-shell="ws" data-ad-nav="users" data-ad-title="Users &amp; roles">

<div id="adPane">
  <div class="ad-hd">
    <div>
      <h1>Users &amp; roles</h1>
      <p>Everyone who can build, use, or monitor apps in <span id="wsName">this workspace</span>.</p>
    </div>
    <div class="ad-hd-acts">
      <button class="ad-btn dark" type="button" id="inviteBtn">Add user</button>
    </div>
  </div>

  <div class="ad-c" style="margin-top:24px;">
    <div class="ad-c-row" style="border-top:0;">
      <div class="tx" style="flex:1;min-width:0;">
        <b id="seatLine">— of — seats used</b>
        <span id="seatSub">—</span>
        <div class="ad-bar ink" style="margin-top:10px;"><i id="seatBar" style="width:0%"></i></div>
      </div>
      <button class="ad-btn sm" type="button" data-stub>Add seats</button>
    </div>
  </div>

  <div class="ad-c">
    <div class="ad-t">
      <div class="hd">
        <div class="grow">Person</div>
        <div style="width:140px;flex:0 0 140px;">Role</div>
        <div style="width:168px;flex:0 0 168px;">Builds with</div>
        <div style="width:120px;flex:0 0 120px;">Last active</div>
        <div style="width:20px;flex:0 0 20px;"></div>
      </div>
      <div id="rows"></div>
    </div>
  </div>
</div>

<script src="../assets/page.js?v=mtg8tt0q.j1"></script>
<script src="../assets/admin-analytics.js?v=mtg8tt0q.j1"></script>
<script src="../assets/admin-data.js?v=mtg8tt0q.j1"></script>
<script src="../assets/admin-shell.js?v=mtg8tt0q.j1"></script>
<script>
  const D = window.ADMIN;
  const w = D.workspace;
  const qs = new URLSearchParams(location.search);
  const company = window.adActiveCompany ? window.adActiveCompany() : w;
  const storeKey = `workspace-users-${company.id}`;
  let addedUsers = window.adDemoStore.read(storeKey, []);
  if (!Array.isArray(addedUsers)) addedUsers = [];
  document.getElementById('wsName').textContent = company.name;
  document.getElementById('seatLine').textContent = `${w.seatsUsed} of ${w.seatsTotal} seats used`;
  document.getElementById('seatSub').textContent = `${w.invitesPending + addedUsers.length} ${(w.invitesPending + addedUsers.length) === 1 ? 'invite' : 'invites'} pending · ${w.plan} plan`;
  document.getElementById('seatBar').style.width = `${Math.round((w.seatsUsed / w.seatsTotal) * 100)}%`;

  function safe(value) {
    return String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
  }

  function renderRows() {
    const members = [...D.members.map((member) => ({ ...member, fixed: true })), ...addedUsers];
    document.getElementById('rows').innerHTML = members.map((m) => {
      const pending = m.pending || m.status === 'Invite sent';
      return `
        <div class="r">
          <div class="grow" style="display:flex;align-items:center;gap:10px;">
            <span class="ad-avatar${pending ? ' dim' : ''}">${safe(m.av || '?')}</span>
            <span style="display:flex;flex-direction:column;min-width:0;">
              <b style="font-size:14px;font-weight:500;line-height:20px;">${safe(m.name)}</b>
              <span style="font-size:12px;color:var(--ad-mute);">${safe(m.email)}${pending ? ' · invite pending' : ''}</span>
            </span>
          </div>
          <div style="width:140px;flex:0 0 140px;"><span class="ad-role">${safe(m.role)}</span></div>
          <div style="width:168px;flex:0 0 168px;display:flex;gap:6px;">
            ${Array.isArray(m.builds) && m.builds.length ? m.builds.map((b) => `<span class="ad-chip">${safe(b)}</span>`).join('') : '<span style="color:var(--ad-faint);">—</span>'}
          </div>
          <div style="width:120px;flex:0 0 120px;font-size:13px;color:var(--ad-ink-4);">${safe(m.seen || 'Invite sent')}</div>
          <div style="width:20px;flex:0 0 20px;" class="end">
            ${m.fixed ? `<button type="button" data-stub aria-label="Manage ${safe(m.name)}" style="color:var(--ad-faint);display:flex;">${window.adIcon('dots')}</button>` : `<button type="button" data-remove-user="${safe(m.id)}" aria-label="Remove ${safe(m.name)}" style="color:var(--ad-faint);display:flex;">${window.adIcon('exit')}</button>`}
          </div>
        </div>`;
    }).join('');

    document.querySelectorAll('#rows [data-stub]').forEach((el) => {
      el.addEventListener('click', () => window.adToast('Role changes aren’t part of this prototype.'));
    });
    document.querySelectorAll('#rows [data-remove-user]').forEach((el) => {
      el.addEventListener('click', () => {
        const removed = addedUsers.find((member) => member.id === el.dataset.removeUser);
        addedUsers = addedUsers.filter((member) => member.id !== el.dataset.removeUser);
        window.adDemoStore.write(storeKey, addedUsers);
        document.getElementById('seatSub').textContent = `${w.invitesPending + addedUsers.length} ${(w.invitesPending + addedUsers.length) === 1 ? 'invite' : 'invites'} pending · ${w.plan} plan`;
        renderRows();
        window.adToast(`${removed ? removed.name : 'User'} removed from ${company.name}.`);
      });
    });
  }

  renderRows();
  document.getElementById('inviteBtn').addEventListener('click', () => {
    location.href = `ws-home.html?demo=michael&settings=users&addWorkspaceUser=1`;
  });
</script>
</body>
</html>
