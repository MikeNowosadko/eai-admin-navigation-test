<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<script src="../assets/dev-cache.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Enterprise AI — three lines, against the clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/proto.css" />
<link rel="stylesheet" href="../assets/funnel.css" />
</head>
<body class="fn">
  <script>try{var t=localStorage;if(t.getItem("eai-roadmap-theme")==="day")document.body.classList.add("day");if(t.getItem("eai-roadmap-nav")==="closed")document.body.classList.add("nav-closed")}catch(e){}</script>

  <header class="fn-bar">
    <a class="brand" href="../index.html"><img src="../assets/logos/eai-wordmark.svg" alt="Enterprise AI" /></a>
    <span class="sep"></span>
    <span class="where">Roadmap</span>
    <div class="spacer"></div>
    <button class="fn-btn" id="theme" aria-label="Switch to day mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg>
      <span class="lbl">Day</span>
    </button>
    <button class="fn-btn" id="print">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 9V3h10v6" />
        <path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2" />
        <path d="M7 14h10v7H7z" />
      </svg>
      Save as PDF
    </button>
  </header>

  <nav class="fn-side">
    <button class="fn-nav-btn" id="nav" aria-expanded="true" aria-label="Hide the roadmap list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M9.5 4v16" />
      </svg>
    </button>
    <p class="grp">Roadmap</p>
    <a class="on" href="timetable.html" title="General roadmap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h7" /></svg><span class="lbl">General roadmap</span></a>
    <a href="funnel.html" title="Usability · CLI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z" /></svg><span class="lbl">Usability &middot; CLI</span></a>
  </nav>

  <div class="fn-head">
    <h1 id="title"></h1>
  </div>

  <main class="tt-wrap">
    <div class="tt-scroll-btns">
      <button id="tt-left" aria-label="Scroll back a quarter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <button id="tt-right" aria-label="Scroll on a quarter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>

    <!-- The quarters and the lanes scroll as one, or the columns and the
         stations under them come apart. -->
    <div class="tt-scroll" id="tt-scroll">
      <div class="tt-canvas">
        <div class="tt-head-row tt-month-row" id="tt-months"></div>
        <div class="tt-head-row" id="tt-cols"></div>
        <div id="tt-plot">
          <div id="tt-rules"></div>
          <div id="tt-lanes"></div>
          <div id="tt-links"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/timetable-data.js"></script>
  <script src="../assets/timetable.js"></script>

  <script src="../assets/daymode.js"></script>
  <script src="../assets/nav.js"></script>

</body>
</html>
