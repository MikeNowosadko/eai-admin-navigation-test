<title>Enterprise AI — the discovery funnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body class="fn">
  <script>try{var t=localStorage;if(t.getItem("eai-roadmap-theme")==="day")document.body.classList.add("day");if(t.getItem("eai-roadmap-nav")==="closed")document.body.classList.add("nav-closed")}catch(e){}</script>

  <header class="fn-bar">
    <a class="brand" href="../index.html"><img src="../assets/logos/eai-wordmark.svg?v=mtg8tt0q.j1" alt="Enterprise AI" /></a>
    <span class="sep"></span>
    <span class="where">Roadmap</span>
    <div class="spacer"></div>
    <button class="fn-btn" id="theme" aria-label="Switch to day mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg>
      <span class="lbl">Day</span>
    </button>
    <button class="fn-btn" id="print">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 9V3h10v6" />
        <path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2" />
        <path d="M7 14h10v7H7z" />
      </svg>
      Save as PDF
    </button>
  </header>

  <nav class="fn-side">
    <button class="fn-nav-btn" id="nav" aria-expanded="true" aria-label="Hide the roadmap list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M9.5 4v16" />
      </svg>
    </button>
    <p class="grp">Roadmap</p>
    <a href="timetable.html" title="General roadmap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h7" /></svg><span class="lbl">General roadmap</span></a>
    <a class="on" href="funnel.html" title="Usability · CLI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z" /></svg><span class="lbl">Usability &middot; CLI</span></a>
  </nav>

  <div class="fn-head">
    <h1 id="title"></h1>
  </div>

  <main class="fn-body">
    <aside class="fn-rail">
      <div id="rail"></div>
    </aside>

    <div id="panel"></div>
  </main>

  <script src="../assets/funnel-data.js?v=mtg8tt0q.j1"></script>
  <script src="../assets/funnel.js?v=mtg8tt0q.j1"></script>

  <script src="../assets/daymode.js?v=mtg8tt0q.j1"></script>
  <script src="../assets/nav.js?v=mtg8tt0q.j1"></script>

</body>
</html>
