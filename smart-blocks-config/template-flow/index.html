<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Template flow — marketing site to published app</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* Tokens mirrored from smart-blocks-config/5layer-editor/src/styles.css */
:root{
  --fg:#252525; --muted:#8e8e8e; --border:#e8e8e8; --border-light:#eef0f2;
  --surface:#fafafa; --paper:#f7f7f3; --card:#fff;
  --brand:#1c84e0; --brand-hover:#1774c8;
  --success:#16a34a; --success-wash:#dcfce7; --danger:#ef4444; --danger-wash:#fef2f2; --pending:#f1f1f1;
  --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:14px; --r-full:999px;
  --accent:#1c84e0; --accent-wash:#eff6ff; --accent-ink:#fff; --app-bg:#fafafa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Geist',system-ui,-apple-system,sans-serif;font-size:14px;color:var(--fg);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.mono{font-family:'Geist Mono',ui-monospace,monospace}

/* ---------- chrome ---------- */
.wrap{min-height:100vh}







.screen{background:#fff;min-height:100vh;overflow:hidden}
.hide{display:none !important}

/* ---------- marketing ---------- */
.mkt{background:var(--paper)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 32px;border-bottom:1px solid var(--border);background:rgba(247,247,243,.92)}
.nav .left{display:flex;align-items:center;gap:32px}
.wordmark{font-size:16px;font-weight:700;letter-spacing:-.02em}
.wordmark span{font-weight:400;color:var(--muted)}
.navlinks{display:flex;gap:24px;font-size:13px;color:#696c74}
.navlinks .on{color:var(--fg);font-weight:500}
.navactions{display:flex;align-items:center;gap:12px;font-size:13px}
.btn-dark{padding:7px 14px;border-radius:var(--r-sm);background:#26251e;color:#fff;font-size:13px}
.btn-out{padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--border);background:#fff;font-size:13px}
.mkt-body{padding:44px 32px 56px}
.mkt-h{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 20px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tcard{display:flex;flex-direction:column;gap:8px;padding:20px;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);text-align:left}
.tcard:hover{border-color:#cfcfcf}
.tcard.hot{border-color:var(--brand);box-shadow:0 10px 26px -18px rgba(28,132,224,.7)}
.dept{align-self:flex-start;padding:3px 9px;border-radius:var(--r-full);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.tcard h4{margin:0;font-size:16px;font-weight:600}
.tcard p{margin:0;font-size:13px;line-height:20px;color:var(--muted)}
.tcard .go{align-self:flex-start;margin-top:6px;padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--border);font-size:12px}
/* shelves */
.mkt-hero{padding:40px 32px 22px;display:flex;flex-direction:column;gap:18px}
.mkt-hero h1{margin:0;font-size:44px;line-height:47px;font-weight:600;letter-spacing:-.03em;max-width:620px}
.mkt-hero .lede{margin:0;font-size:16px;line-height:25px;color:#696c74;max-width:520px}
.chips-row{display:flex;flex-wrap:wrap;gap:8px}
.catchip{padding:7px 14px;border-radius:var(--r-full);background:#fff;border:1px solid var(--border);font-size:13px;color:var(--fg)}
.catchip:hover{border-color:#cfcfcf}
.catchip.on{background:#26251e;border-color:#26251e;color:#fff;font-weight:500}
.catchip.more{color:var(--muted)}
.searchbar{display:flex;align-items:center;gap:12px;max-width:520px;padding:14px 18px;border-radius:var(--r-xl);background:#fff;border:1px solid #dedcd5;box-shadow:0 8px 22px -18px rgba(38,37,30,.5)}
.searchbar .ph{flex:1;font-size:15px;color:#b4b4b4}
.searchbar .cnt{font-size:12px;color:#8b8a83}
.shelf{padding:14px 0 26px 32px}
.shelf-head{display:flex;align-items:baseline;gap:12px;padding-right:32px}
.shelf-head h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.shelf-head .blurb{flex:1;font-size:13px;color:var(--muted)}
.shelf-head .see{font-size:13px;font-weight:500;color:var(--brand)}
.track{display:flex;gap:18px;margin-top:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tile{width:400px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;text-align:left}
.tile .shot{height:230px;border-radius:12px;border:1px solid var(--border);background:#f1f0ee;padding:20px 20px 0;overflow:hidden}
.tile.live .shot{border-color:var(--border)}
.tile.live:hover .shot{border-color:var(--brand);box-shadow:0 12px 30px -20px rgba(28,132,224,.75)}
.tile .nm{font-size:16px;font-weight:600}
.tile .mt{font-size:13px;color:var(--muted)}
.tile.live .nm:after{content:' ›';color:var(--brand)}
/* window inside a tile */
.win{height:100%;background:#fff;border:1px solid rgba(38,37,30,.08);border-bottom:0;border-radius:8px 8px 0 0;overflow:hidden;display:flex;flex-direction:column}
.win-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.win-bar .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.win-bar .t{font-size:11px;font-weight:600}
.win-bar .s{font-size:10px;color:var(--muted)}
.win-in{padding:12px;display:flex;flex-direction:column;gap:9px;flex:1}
.mk-row{display:flex;align-items:center;gap:9px;font-size:10px}
.mk-row .ic{width:14px;height:14px;border-radius:50%;flex-shrink:0;display:grid;place-items:center}
.mk-row .gr{flex:1}
.mk-row .rt{width:44px;flex-shrink:0;text-align:left}
.mk-th{display:flex;gap:8px;padding:8px 12px;background:#fafaf8;border-bottom:1px solid var(--border);font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mk-td{display:flex;gap:8px;padding:9px 12px;border-bottom:1px solid #f2f2ef;font-size:10px}
.mk-stats{display:flex;gap:10px;padding:14px 12px 10px}
.mk-stats .st{flex:1;display:flex;flex-direction:column;gap:2px}
.mk-stats .v{font-size:19px;font-weight:600;letter-spacing:-.02em}
.mk-stats .k{font-size:9px;color:var(--muted)}
.mk-bars{display:flex;align-items:flex-end;gap:5px;height:76px;padding:0 12px 14px;flex:1}
.mk-bars i{flex:1;border-radius:2px;background:#e7e5de;display:block}
.mk-kan{display:flex;gap:8px;padding:12px;flex:1}
.mk-kan .col{flex:1;display:flex;flex-direction:column;gap:6px}
.mk-kan .h{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mk-card{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:5px;background:#f7f7f4;border:1px solid var(--border)}
.mk-card .n{font-size:9px;font-weight:600}
.mk-card .d{font-size:8px;color:var(--muted)}
.mk-tl{display:flex;gap:10px}
.mk-tl .tm{width:44px;flex-shrink:0;font-size:9px;color:var(--muted);font-family:'Geist Mono'}
.mk-tl .ln{width:1px;background:#e4e2db;flex-shrink:0}
.mk-tl .ev{flex:1;padding:0 0 12px 10px;display:flex;flex-direction:column;gap:2px}
.mk-tl .ev b{font-size:10px;font-weight:600}
.mk-tl .ev span{font-size:9px;color:var(--muted)}
.mk-gantt{display:flex;align-items:center;gap:8px}
.mk-gantt .lb{width:66px;flex-shrink:0;font-size:9px;color:var(--muted)}
.mk-gantt .bar{flex:1;height:12px;display:flex}
.mk-gantt .bar i{border-radius:3px;display:block}
.mk-mail{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:6px;border:1px solid var(--border)}

/* ---------- template detail ---------- */
.detail{background:var(--paper)}
.hero{display:flex;gap:40px;padding:36px 32px 40px}
.hero .copy{width:460px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}
.bcrumb{font-size:12px;color:#8b8a83}
.hero h1{margin:0;font-size:46px;line-height:48px;font-weight:600;letter-spacing:-.03em}
.hero p.lede{margin:0;font-size:16px;line-height:25px;color:#696c74}
.meta{display:flex;gap:14px;font-size:12px;color:#696c74}
.ctas{display:flex;gap:10px;padding-top:4px}
.btn-primary{padding:12px 22px;border-radius:var(--r-md);background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:600}
.btn-primary:hover{filter:brightness(.94)}
.btn-second{padding:12px 20px;border-radius:var(--r-md);background:#fff;border:1px solid #dedcd5;font-size:14px}
.fineprint{font-size:12px;color:#8b8a83}
.previewcol{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.devbar{display:flex;align-items:center;gap:10px}
.devbar .lbl{flex:1;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8b8a83}
.devswitch{display:flex;gap:2px;padding:3px;border-radius:var(--r-full);background:#fff;border:1px solid #e4e2db}
.devswitch button{width:34px;height:26px;border-radius:var(--r-full);display:grid;place-items:center;color:#8b8a83}
.devswitch button.on{background:#26251e;color:#fff}
.devsize{width:66px;font-size:12px;color:#8b8a83}
.stage{display:flex;justify-content:center;padding:16px;border-radius:var(--r-xl);background:#edece8;border:1px solid #e4e2db;min-height:430px}
.stage.tablet{padding:16px 90px}
.stage.mobile{padding:22px;align-items:flex-start}











.blocks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:32px}
.bcard{padding:18px;border:1px solid var(--border);border-radius:var(--r-lg);background:#fff;display:flex;flex-direction:column;gap:8px}
.btag{align-self:flex-start;padding:4px 10px;border-radius:var(--r-full);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.bcard h4{margin:0;font-size:15px;font-weight:600}
.bcard p{margin:0;font-size:12px;line-height:19px;color:var(--muted)}
.ctabar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 32px;background:#26251e;color:#f4f3f0}
.ctabar h3{margin:0 0 3px;font-size:19px;font-weight:600}
.ctabar p{margin:0;font-size:13px;color:rgba(244,243,240,.65)}
.btn-light{padding:12px 24px;border-radius:var(--r-md);background:#f4f3f0;color:#26251e;font-size:14px;font-weight:600}

/* ---------- builder shell ---------- */
.builder{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.tb-icon{width:34px;height:34px;border-radius:var(--r-md);border:1px solid var(--border);display:grid;place-items:center}
.tb-title{font-size:16px;font-weight:600}
.pill{padding:4px 10px;border-radius:var(--r-full);background:var(--surface);font-size:12px;color:var(--muted)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted)}
.btn-pub{padding:9px 18px;border-radius:var(--r-md);background:#efefef;color:#b4b4b4;font-size:13px;font-weight:500}
.btn-pub.live{background:var(--brand);color:#fff}
.bbody{display:grid;grid-template-columns:384px 1fr;flex:1;min-height:0}
.chat{display:flex;flex-direction:column;border-right:1px solid var(--border);min-height:0}
.chat-scroll{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{font-size:14px;line-height:20px}
.msg b{font-weight:600}
.result{display:flex;gap:10px;align-items:flex-start}
.tick{width:20px;height:20px;border-radius:var(--r-full);background:var(--success-wash);color:var(--success);display:grid;place-items:center;flex-shrink:0}
.result .rt{font-size:13px;font-weight:600}
.result .rs{font-size:12px;color:var(--muted)}
.result button.edit{font-size:11px;color:var(--brand);align-self:center}
.chat-input{display:flex;align-items:center;gap:8px;padding:14px 16px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input .box{flex:1;padding:10px 16px;border-radius:var(--r-full);border:1px solid var(--border);font-size:13px;color:var(--muted)}
.send{width:36px;height:36px;border-radius:var(--r-full);background:var(--brand);color:#fff;display:grid;place-items:center;flex-shrink:0}

.clarify{border:1px solid var(--border);border-radius:var(--r-xl);background:#fff;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:14px}
.clarify .q{font-size:15px;line-height:20px;font-weight:600}
.clarify .help{font-size:13px;line-height:18px;color:var(--muted);margin-top:3px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--r-md);text-align:left;width:100%}
.opt:hover{border-color:#cfcfcf}
.opt.on{border-color:var(--fg);background:var(--surface)}
.ind{width:16px;height:16px;border-radius:var(--r-full);border:1.5px solid #d5d5d5;flex-shrink:0;display:grid;place-items:center}
.ind.sq{border-radius:4px}
.opt.on .ind{background:var(--fg);border-color:var(--fg);color:#fff}
.opt .txt{flex:1;font-size:14px}
.opt .kind{font-size:11px;color:var(--muted)}
.exp{padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border-light);display:flex;flex-direction:column;gap:12px}
.exp .lbl{font-size:11px;font-weight:600;color:var(--muted)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px 4px;border-radius:var(--r-sm);border:1px solid var(--border);background:#fff;font-size:11px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--fg);border-color:var(--fg);color:#fff;font-weight:500}
.row{display:flex;align-items:center;gap:9px;font-size:12px}
.row .grow{flex:1}
.sw{width:32px;height:18px;border-radius:var(--r-full);background:#dcdcdc;padding:2px;display:flex;flex-shrink:0}
.sw i{width:14px;height:14px;border-radius:var(--r-full);background:#fff;display:block}
.sw.on{background:var(--brand);justify-content:flex-end}
.chk{width:14px;height:14px;border-radius:4px;border:1.5px solid #d5d5d5;flex-shrink:0;display:grid;place-items:center}
.chk.on{background:var(--brand);border-color:var(--brand);color:#fff}
.srcrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--border);background:#fff;width:100%;text-align:left}
.srcrow.on{border-color:var(--brand);background:var(--accent-wash)}
.srcrow .nm{font-size:13px;font-weight:500}
.srcrow .dt{font-size:11px;color:var(--muted)}
.tag{padding:3px 9px;border-radius:var(--r-full);font-size:10px;font-weight:600}
.tag.ok{background:var(--success-wash);color:var(--success)}
.tag.link{color:var(--brand)}
.cfoot{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--border-light)}
.cfoot .count{flex:1;font-size:12px;color:var(--muted)}
.btn-skip{padding:8px 14px;border-radius:var(--r-md);font-size:13px;color:var(--muted)}
.btn-next{padding:8px 18px;border-radius:var(--r-md);background:var(--brand);color:#fff;font-size:13px;font-weight:500}
.btn-next[disabled]{background:#e4e4e4;color:#a8a8a8;cursor:not-allowed}

.prev{display:flex;flex-direction:column;background:var(--surface);min-width:0}
.prev-head{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.prev-head .t{font-size:13px;font-weight:600}
.toggle{display:flex;gap:2px;padding:3px;border-radius:var(--r-full);background:var(--pending)}
.toggle button{padding:6px 13px;border-radius:var(--r-full);font-size:12px;color:var(--muted)}
.toggle button.on{background:#fff;font-weight:500;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.prev-view{flex:1;padding:22px;overflow:auto;display:flex;justify-content:center}

/* ---------- the generated app ---------- */
.app{width:100%;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:#fff;box-shadow:0 12px 34px -22px rgba(10,12,20,.4);align-self:flex-start}
.app.w-tablet{max-width:700px}
.app.w-mobile{max-width:380px;border-radius:22px;border:8px solid #26251e}
.app-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--accent);color:var(--accent-ink)}
.app-logo{width:28px;height:28px;border-radius:var(--r-md);background:var(--accent-ink);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.app-logo.swoosh{background:none}
.app-name{font-size:15px;font-weight:700}
.app-sub{margin-left:auto;font-size:11px;opacity:.8}
.app-body{padding:20px;background:var(--app-bg);flex:1;display:flex;flex-direction:column;gap:14px}
.app-title{font-size:22px;font-weight:700;letter-spacing:-.02em}
.tabs{display:flex;gap:8px}
.tabs .tab{flex:1;padding:9px 4px;border-radius:var(--r-md);background:#fff;border:1px solid var(--border);font-size:12px;color:var(--muted);text-align:center}
.tabs .tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:16px;font-weight:600}
.panel .psub{margin:0;font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600}
.field .inp{padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-md);font-size:13px;color:var(--muted)}
.two{display:flex;gap:12px}
.two>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--border);font-size:11px}
.subj{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-md);font-size:12px;width:100%;text-align:left;background:#fff}
.subj.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,#fff)}
.subj .dot{width:14px;height:14px;border-radius:var(--r-full);border:1.5px solid #d5d5d5;flex-shrink:0;display:grid;place-items:center}
.subj.on .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.email{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.email .meta{padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border-light);display:block}
.email .subject{font-size:14px;font-weight:700}
.email .pre{font-size:12px;color:var(--muted);margin-top:3px}
.email .body{padding:16px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:20px}
.email .cta{align-self:flex-start;padding:10px 20px;border-radius:var(--r-md);background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600}
.filerow{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-md);font-size:13px}
.filerow .dot{width:8px;height:8px;border-radius:var(--r-full);background:var(--success);flex-shrink:0}
.filerow .when{margin-left:auto;font-size:11px;color:var(--muted)}
.note{padding:12px 14px;border-radius:var(--r-md);background:var(--app-bg);border:1px solid var(--border);font-size:12px;line-height:18px}
.rt-title{font-size:18px;font-weight:700;margin:0}
.rtable{width:100%;border:1px solid var(--border);border-radius:var(--r-md);border-collapse:separate;border-spacing:0;overflow:hidden;font-size:13px}
.rtable th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:13px 14px;border-bottom:1px solid var(--border)}
.rtable td{padding:13px 14px;border-bottom:1px solid var(--border-light)}
.rtable tr:last-child td{border-bottom:0}
.rtable tr.clickable:hover td{background:#fbfbfb;cursor:pointer}

/* ------------------------------------------------------------
   Brand matching — one email does sign-up and brand lookup.
   Known domains resolve to a designed brand; anything else gets
   a palette derived from the domain so every demo is painted.
   ------------------------------------------------------------ */
const DIRECTORY = { 'lumina.com':'lumina', 'nike.com':'nike' };

const FREEMAIL = ['gmail.com','googlemail.com','outlook.com','hotmail.com','live.com','yahoo.com','icloud.com','me.com','proton.me','protonmail.com','aol.com'];

function hashStr(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619) } return h>>>0 }

function hsl2hex(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const hx=n=>Math.round(255*f(n)).toString(16).padStart(2,'0');
  return ('#'+hx(0)+hx(8)+hx(4)).toUpperCase();
}

function hexHue(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return 210;
  const n = parseInt(m[1],16), r=(n>>16)/255, g=((n>>8)&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  if(!d) return 0;
  const h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? (b-r)/d+2 : (r-g)/d+4;
  return Math.round(h*60);
}

/* White text on a pale accent is the one way this can look broken. */
function inkFor(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return '#fff';
  const n = parseInt(m[1],16);
  const ch = [(n>>16)&255,(n>>8)&255,n&255].map(v=>{ v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4) });
  const L = .2126*ch[0] + .7152*ch[1] + .0722*ch[2];
  return L > .45 ? '#26251E' : '#fff';
}

/* Domain -> a brand we have never seen before, but that looks deliberate. */
function makeBrand(domain){
  const stem = domain.split('.')[0].replace(/[^a-z0-9]/gi,'');
  const name = stem.charAt(0).toUpperCase()+stem.slice(1);
  const hue  = hashStr(domain) % 360;
  const accent = hsl2hex(hue, 62, 44);
  const wash   = hsl2hex(hue, 34, 96);
  const deep   = hsl2hex(hue, 30, 16);
  const second = hsl2hex((hue+38)%360, 58, 55);
  return Object.assign({}, BRANDS.none, {
    key:'d:'+domain, name, site:domain, initial:name.charAt(0), sector:'Matched from your email',
    accent, wash, ink:inkFor(accent), swatches:[accent,wash,deep,second],
    tone:'Clear, plain, straight to the point', type:'Geist · system',
    goal:'Announce something new at '+name, audience:name+' newsletter list',
    subjects:['Something new from '+name, name+' — what changed this month', 'A quick note from '+name],
    pre:'A short preview line, written from your brief and your assets.',
    files:[stem+'-brand-guide.pdf','tone-of-voice.docx','product-shots.zip'],
    generated:true,
  });
}

/* The whole point: type an email, get a brand. */
function resolveBrand(email){
  const at = String(email||'').indexOf('@');
  if(at < 1) return null;
  const domain = email.slice(at+1).trim().toLowerCase().replace(/^www\./,'');
  if(!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(domain)) return null;
  if(FREEMAIL.includes(domain)) return {domain, personal:true, key:null};
  const known = DIRECTORY[domain];
  if(known) return {domain, personal:false, key:known};
  const b = makeBrand(domain);
  BRANDS[b.key] = b;                       // register so BRANDS[v] keeps working
  return {domain, personal:false, key:b.key};
}

/* Re-render without losing the caret — the preview repaints on every keystroke. */
function renderKeepingFocus(){
  const a = document.activeElement;
  const id = a && a.id, pos = a && a.selectionStart;
  render();
  if(id){
    const el = $(id);
    if(el){ el.focus(); if(pos!=null && el.setSelectionRange) el.setSelectionRange(pos,pos) }
  }
}

function wireWorkspace(){
  const em = $('cemail'), ws = $('cws');
  if(!em) return;
  /* first time the card lands, put the cursor where the work starts */
  if(!state.email && document.activeElement === document.body) em.focus();

  em.oninput = ()=>{
    state.email = em.value;
    state.match = resolveBrand(state.email);
    state.brand = state.match && !state.match.personal ? state.match.key : 'none';
    /* the workspace name follows the brand until they name it themselves */
    if(!state.wsTouched) state.workspace = state.brand==='none' ? '' : BRANDS[state.brand].name;
    renderKeepingFocus();
  };
  if(ws) ws.oninput = ()=>{ state.wsTouched = true; state.workspace = ws.value; renderKeepingFocus() };

  document.querySelectorAll('[data-wsnext]').forEach(el=>el.onclick=()=>{
    state.answers.workspace = state.workspace.trim();
    if(state.brand!=='none') state.answers.brand = state.brand;
    state.step = 1; render();
  });
  document.querySelectorAll('[data-wsskip]').forEach(el=>el.onclick=()=>{
    state.brand='none'; state.answers.workspace = state.workspace.trim() || 'My workspace';
    state.step = 1; render();
  });
  /* the swatches in the brand strip stay pickable here too */
  document.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{setAccent(el.dataset.pick);render()});
}

function reviewers(){
  const b = brand();

    const d = state.decisions[i];
    list.push({
      role, name:p.n, initials:p.i,
      status: d ? d.status : (i===0 && state.levels>1 ? 'approved' : 'pending'),
      signed: d ? d.signed : (i===0 && state.levels>1 ? '2 Oct' : ''),
      comment: d ? d.comment : (i===0 && state.levels>1 ? 'Subject line is the strongest one.' : ''),

/* The brand step shows the matched brand first, then the alternatives. */
function brandOptions(){
  const seen = [], out = [];
  const add = k => { if(BRANDS[k] && !seen.includes(k)){ seen.push(k);
    out.push({v:k, t:BRANDS[k].name+' — '+BRANDS[k].site}) } };
  if(state.brand!=='none') add(state.brand);
  add('lumina'); add('nike');
  out.push({v:'none', t:'No brand yet'});
  return out;
}

function whoOptions(){
  const b = brand();
  return b.roles.map(r=>({v:r,t:r,kind:'a role'}))
    .concat([{v:'Whoever the user picks',t:'Whoever the user picks',kind:'an individual'}]);
}

/* ---------- sign-up + brand match ---------- */

/* Coming in from the marketing site, nothing is branded yet. */
const PRISTINE = JSON.parse(JSON.stringify({lumina:BRANDS.lumina, nike:BRANDS.nike, none:BRANDS.none}));

function startSetup(){
  Object.keys(PRISTINE).forEach(k=>{ Object.assign(BRANDS[k], JSON.parse(JSON.stringify(PRISTINE[k]))) });
  state.brand='none'; state.match=null; state.editColours=false;
  state.email=''; state.workspace=''; state.wsTouched=false;
  state.step=0; state.answers={}; state.decisions=[];
}

/* One place that paints the app, whether the colour came from a
   swatch or the colour picker. */
function setAccent(hex){
  const b = brand();
  if(b.key==='none') return;
  b.accent = hex.toUpperCase();
  b.ink = inkFor(b.accent);
  b.swatches = b.swatches.slice(); b.swatches[0] = b.accent;
  b.wash = hsl2hex(hexHue(b.accent), 34, 96);
}

/* Straight into the builder with the brand step already settled. */
function intoBuilder(key){
  state.brand = key;
  state.answers.brand = key;
  state.step = 1;
  state.screen = 'builder';
  render();
}

function wireSetup(){
  const input = $('wemail');
  if(input){
    const sync = ()=>{
      state.email = input.value;
      state.match = resolveBrand(state.email);
      $('domhint').textContent = state.match ? state.match.domain : '';
      $('emailhint').innerHTML  = matchHint(state.match);
      $('sgo').disabled = !state.match;
    };
    input.oninput = sync;
    input.onkeydown = e=>{ if(e.key==='Enter' && state.match){ e.preventDefault(); continueFromEmail() } };
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }

  document.querySelectorAll('[data-continue]').forEach(el=>el.onclick=continueFromEmail);
  document.querySelectorAll('[data-unbranded]').forEach(el=>el.onclick=()=>intoBuilder('none'));
  document.querySelectorAll('[data-usebrand]').forEach(el=>el.onclick=()=>intoBuilder(state.brand));
  document.querySelectorAll('[data-editcolours]').forEach(el=>el.onclick=()=>{state.editColours=!state.editColours;render()});
  document.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{setAccent(el.dataset.pick);render()});

  const cp = $('cpick');
  if(cp){
    /* repaint while dragging, re-render once they let go so the swatch catches up */
    cp.oninput  = ()=>{ setAccent(cp.value); applyBrandVars() };
    cp.onchange = ()=>{ setAccent(cp.value); render() };
  }
}

function continueFromEmail(){
  const m = state.match;
  if(!m) return;
  if(m.personal){ intoBuilder('none'); return }
  state.brand = m.key;
  state.editColours = false;
  state.screen = 'brandmatch';
  render();
}


function wire(){
  document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{state.screen=el.dataset.goto;render()});
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{
    let to = el.dataset.open;
    if(to==='signup'){ startSetup(); if(VARIANT==='chat') to='builder' }
    state.screen=to; render();
  });
  document.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{state.cat=el.dataset.cat;render()});
  document.querySelectorAll('[data-dev]').forEach(el=>el.onclick=()=>{state.device=el.dataset.dev;render()});
  document.querySelectorAll('[data-subject]').forEach(el=>el.onclick=()=>{state.subject=+el.dataset.subject;render()});

  document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.answer, v = el.dataset.value;
    state.answers[id] = v;
    if(id==='brand'){ state.brand = v; }
    if(id==='assets'){ state.source = v; }
    render();
  });
  document.querySelectorAll('[data-next]').forEach(el=>el.onclick=()=>{
    const q = QS()[state.step];
    if(state.answers[q.id]===undefined && !q.custom){ state.answers[q.id] = q.dynamic ? whoOptions()[0].v : q.options[0].v; if(q.id==='brand')state.brand=state.answers[q.id]; }
    state.step = Math.min(state.step+1, QS().length);
    render();
  });
  document.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>{state.step=+el.dataset.step;render()});
  document.querySelectorAll('[data-levels]').forEach(el=>el.onclick=()=>{state.levels=+el.dataset.levels;state.decisions=[];render()});
  document.querySelectorAll('[data-outcomes]').forEach(el=>el.onclick=()=>{state.outcomes=el.dataset.outcomes;render()});
  document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{
    if(el.dataset.toggle==='comment') state.needComment=!state.needComment; else state.needSignature=!state.needSignature;
    render();
  });
  document.querySelectorAll('[data-review]').forEach(el=>el.onclick=()=>{state.dialog=+el.dataset.review;render()});
  document.querySelectorAll('[data-close]').forEach(el=>el.onclick=e=>{ if(e.target===el){state.dialog=null;render()} });
  document.querySelectorAll('[data-stop]').forEach(el=>el.onclick=e=>e.stopPropagation());
  document.querySelectorAll('[data-decide]').forEach(el=>el.onclick=()=>{
    const i = state.dialog;
    state.decisions[i] = {status: el.dataset.decide==='approved'?'approved':'pending', signed:'3 Oct', comment: el.dataset.decide==='approved'?'Approved — on brand.':'Sent back for changes.'};
    state.dialog=null; render();
  });

  wireSetup();
  wireWorkspace();
}

/* Deep link for user testing: land straight on the sign-up, optionally prefilled.
   ?screen=signup · ?email=jo@lumina.com */
const Q = new URLSearchParams(location.search);
if(Q.has('email') || Q.get('screen')==='signup'){
  startSetup();
  state.email = Q.get('email') || '';
  state.match = resolveBrand(state.email);
  if(VARIANT==='chat'){
    state.brand = state.match && !state.match.personal ? state.match.key : 'none';
    if(state.brand!=='none') state.workspace = BRANDS[state.brand].name;
    state.screen = 'builder';
  } else {
    state.screen = 'signup';
  }
}

render();
</script>
</body>
</html>
