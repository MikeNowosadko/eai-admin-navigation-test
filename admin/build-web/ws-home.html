      </button>

      <div class="home-samples" role="group" aria-labelledby="mktSamplesLabel">

  <div class="ad-sec-hd"><b>Recent apps</b><a class="ad-link" href="ws-processes.html">View all ›</a></div>

<script src="../assets/page.js?v=mtg8tt0q.j1"></script>
<script src="../assets/admin-analytics.js?v=mtg8tt0q.j1"></script>
<script src="../assets/admin-data.js?v=mtg8tt0q.j1"></script>
<script src="../assets/admin-shell.js?v=transition3"></script>
<script>
  const D = window.ADMIN;
  const escapeAppText = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const recentProcesses = new URLSearchParams(location.search).get('demo') === 'michael' && window.adCompanyProcesses
    ? window.adCompanyProcesses()
    : D.processes;
  document.getElementById('recent').innerHTML = recentProcesses.slice(0, 3).map((p) => `
    <a class="ad-t-r" href="${window.adBuilderAppHref ? window.adBuilderAppHref(p.id) : `app-overview.html?app=${p.id}`}">
      <span class="tx"><b>${escapeAppText(p.name)}</b><span>${escapeAppText(p.subtitle)}</span></span>
      <span class="st">${p.status === 'Live' ? '<i class="live"></i>' : '<i class="draft"></i>'}${p.status}</span>
      <span class="ago">${p.seen}</span>
    </a>`).join('');
  document.querySelectorAll('[data-sample-prompt]').forEach(button => {
    button.addEventListener('click', () => {
      document.getElementById('prompt').value = button.dataset.samplePrompt;
      document.getElementById('prompt').focus();
    });
  });
  document.getElementById('composer').addEventListener('submit', (e) => {
    e.preventDefault();
    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) {
      document.getElementById('prompt').focus();
      return;
    }

    const activeCompany = window.adActiveCompany ? window.adActiveCompany() : D.workspace;
    const appId = prompt.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 36) + '-' + Date.now().toString(36);
    const name = prompt.replace(/^build\s+(?:an?\s+)?app\s+(?:that\s+)?(?:manages?\s+)?(?:my\s+)?/i, '').replace(/^./, c => c.toUpperCase());
    const savedApps = JSON.parse(localStorage.getItem('eai-local-admin:workspace-apps') || '[]');
    savedApps.unshift({id:appId, name, prompt, ws:activeCompany.name, companyId:activeCompany.id, initial:name.charAt(0), status:'Draft', live:false, stats:null, seen:'Just now', hoursAgo:0, buildSurface:'NCB', subtitle:'Built with EAI', url:'—'});
    localStorage.setItem('eai-local-admin:workspace-apps', JSON.stringify(savedApps));
    const query = new URLSearchParams({
      prompt, project:name, workspaceApp:'1', drawer:'open',
      app: appId,
      demo: 'michael',
      ws: activeCompany.name,
      email: D.user.email,
      surface: 'ncb',
      experience: 'full',
      source: 'workspace',
    });

    location.href = `../../build-web/builder-chat-first.html?${query.toString()}`;
  });
</script>
