<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="eai-url" content="enterpriseaigroup.com/signup/workspace" />
<title>Prototype — Set up your workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/proto.css" />
<link rel="stylesheet" href="../../assets/signup.css" />
</head>
<body>

  <!-- The last thing between a person and the product, and now the only
       thing: choosing a plan came out of sign-up. Everyone starts on
       Builder, free, which is said here in one line rather than asked as a
       question — pricing a product you have not seen is not a decision, it
       is a toll booth.

       The workspace they name is the one the setup app will offer them
       twenty minutes later, so the name travels: query string to the app,
       and from the app up to the desktop shell. Seeing your own words come
       back inside a native app is most of what makes the two halves feel
       like one product. -->

  <div class="ws-wrap plain" style="min-height:100vh;">
    <form class="ws-form" id="wsForm" onsubmit="return false;">
      <img src="../../assets/logos/eai-mark-dark.svg" alt="" class="mark" />
      <br />
      <img src="../../assets/logos/eai-wordmark.svg" alt="Enterprise AI" class="wordmark" />
      <h3>Set up your workspace</h3>
      <p>This is the workspace name shown in the admin portal, and the one your apps belong to.</p>

      <label for="wsCountry">Country</label>
      <select id="wsCountry">
        <option value="">Select country</option>
        <option>Australia</option>
        <option>New Zealand</option>
        <option>United Kingdom</option>
        <option>United States</option>
      </select>

      <label for="wsName">Workspace name</label>
      <input type="text" id="wsName" placeholder="Northwind Group" autocomplete="off" />

      <div class="captcha">
        <input type="checkbox" id="wsHuman" />
        <label for="wsHuman" style="margin:0;">I am human</label>
        <span class="brand">Friendly Captcha</span>
      </div>

      <button class="btn btn-dark go" id="wsGo" disabled type="button">Create workspace</button>

      <p class="ws-plan">
        You&rsquo;ll start on <b>Builder</b> &mdash; free while it&rsquo;s in preview, no card needed.
        You can change plan later from the workspace.
      </p>
    </form>
  </div>

<script src="../../assets/page.js"></script>
<script>
  // Continue stays disabled until the form is actually complete.
  const name = document.getElementById('wsName');
  const country = document.getElementById('wsCountry');
  const human = document.getElementById('wsHuman');
  const go = document.getElementById('wsGo');

  const check = () => { go.disabled = !(name.value.trim() && country.value && human.checked); };
  [name, country, human].forEach((f) => { f.addEventListener('input', check); f.addEventListener('change', check); });

  go.addEventListener('click', () => {
    const email = new URLSearchParams(window.location.search).get('email');
    const q = new URLSearchParams({ ws: name.value.trim(), country: country.value });
    if (email) q.set('email', email);
    window.location.href = `app.html?${q}`;
  });
</script>

</body>
</html>
